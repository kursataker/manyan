# Pushing a tag vX.Y.Z builds tpp on each platform, runs the conformance
# suite with each build, and publishes them as the release X.Y.Z.
# Run by hand, it builds and tests without publishing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^#define TPP_VERSION "\(.*\)"$/\1/p' tpp.h)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but tpp.h says $version"; exit 1
          fi
          grep -qx "## $version" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      # arm64 profile-guided; x86_64 from the same profile, run under Rosetta.
      - run: |
          make release
          mkdir arm64 x86_64
          mv tpp arm64/tpp
          cc -O2 -std=c11 -fprofile-instr-use=.obj/pgo/tpp.profdata -arch x86_64 tpp.c -lm -o x86_64/tpp
      - run: |
          softwareupdate --install-rosetta --agree-to-license
          for arch in arm64 x86_64; do
            python3 tests/spec_runner.py "arch -$arch $PWD/$arch/tpp" --strict --verbose
            python3 tests/spec_runner.py "arch -$arch $PWD/$arch/tpp -workers 4" --strict --verbose
          done
      - run: |
          for arch in arm64 x86_64; do
            dir=tpp-${{ needs.version.outputs.version }}-macos-$arch
            mkdir $dir && cp $arch/tpp README.md CHANGELOG.md LICENSE $dir
            tar -czf $dir.tar.gz $dir
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: "*.tar.gz"

  linux:
    needs: version
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: make release LDFLAGS=-static
      - run: |
          python3 tests/spec_runner.py ./tpp --strict --verbose
          python3 tests/spec_runner.py "./tpp -workers 4" --strict --verbose
      - run: |
          dir=tpp-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}
          mkdir $dir && cp tpp README.md CHANGELOG.md LICENSE $dir
          tar -czf $dir.tar.gz $dir
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: "*.tar.gz"

  # Workers fork and share memory, so Windows gets Cygwin's POSIX.
  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
    env:
      CHERE_INVOKING: "1"   # Cygwin's login shell stays in the checkout
    steps:
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v4
      - uses: cygwin/cygwin-install-action@v4
        with:
          packages: gcc-core make python3 zip
      - run: make release
      - run: |
          python3 tests/spec_runner.py ./tpp --strict --verbose
          python3 tests/spec_runner.py "./tpp -workers 4" --strict --verbose
      - run: |
          dir=tpp-${{ needs.version.outputs.version }}-windows-x86_64
          mkdir $dir && cp tpp.exe /usr/bin/cygwin1.dll README.md CHANGELOG.md LICENSE $dir
          zip -qr $dir.zip $dir
      - shell: pwsh
        run: |
          .\tpp-${{ needs.version.outputs.version }}-windows-x86_64\tpp.exe -version
          if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "*.zip"

  # Cygwin has no arm64 port: Windows on Arm runs the x86_64 build, emulated.
  windows-arm:
    needs: [version, windows]
    runs-on: windows-11-arm
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
    env:
      CHERE_INVOKING: "1"
    steps:
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v4
      - uses: cygwin/cygwin-install-action@v4
        with:
          packages: python3 unzip
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - run: unzip -q tpp-${{ needs.version.outputs.version }}-windows-x86_64.zip
      # As it ships, from Windows; then the suite in Cygwin, whose own dll
      # it must use there, as two Cygwin dlls in one session conflict.
      - shell: pwsh
        run: |
          .\tpp-${{ needs.version.outputs.version }}-windows-x86_64\tpp.exe -version
          if ($LASTEXITCODE) { exit 1 }
      - run: |
          mkdir solo && cp tpp-${{ needs.version.outputs.version }}-windows-x86_64/tpp.exe solo/
          python3 tests/spec_runner.py "$PWD/solo/tpp.exe" --strict --verbose
          python3 tests/spec_runner.py "$PWD/solo/tpp.exe -workers 4" --strict --verbose

  publish:
    if: github.ref_type == 'tag'
    needs: [version, macos, linux, windows, windows-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          awk -v h="## $VERSION" '$0 == h {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "tpp $VERSION" --notes-file notes.md
